<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>摘星之旅 · 开场CG</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000; overflow: hidden;
    font-family: "PingFang SC", "SF Pro Text", system-ui, sans-serif;
    user-select: none;
  }
  #stage {
    position: relative; width: 100vw; height: 100vh; overflow: hidden;
    background: #000;
  }
  video {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    object-fit: cover; opacity: 0; transition: opacity 1s ease;
  }
  video.active { opacity: 1; }

  .bar {
    position: absolute; left: 0; width: 100%; height: 8%;
    background: #000; z-index: 3; pointer-events: none;
  }
  .bar.top { top: 0; }
  .bar.bottom { bottom: 0; }

  /* Progress */
  #progress {
    position: absolute; top: 50%; right: 28px; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 14px; z-index: 10;
  }
  #progress .pd {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(120,110,160,0.25); transition: all .35s;
  }
  #progress .pd.active { background: #a0c8ff; box-shadow: 0 0 10px #a0c8ff; transform: scale(1.3); }

  #bgm-status {
    position: absolute; top: 18px; right: 28px; z-index: 10;
    display: flex; align-items: center; gap: 8px;
    color: rgba(160, 140, 200, 0.6); font-size: 12px; letter-spacing: 1px;
  }
  #bgm-status .icon {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid rgba(160, 140, 200, 0.3);
  }
  #bgm-status .icon.playing {
    border-color: #a0c8ff; animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(160, 200, 255, 0.3); }
    50% { box-shadow: 0 0 0 6px rgba(160, 200, 255, 0); }
  }

  #controls {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 12px; z-index: 20;
    opacity: 0.3; transition: opacity 0.3s;
  }
  #controls:hover { opacity: 1; }
  #controls button {
    background: rgba(20, 16, 40, 0.85); color: #a0c8ff;
    border: 1px solid #2a2860; padding: 8px 20px;
    border-radius: 20px; cursor: pointer; font-size: 13px;
    letter-spacing: 1px; transition: all 0.3s;
  }
  #controls button:hover { background: #2a2860; }

  #title-card {
    position: absolute; inset: 0;
    z-index: 15; display: flex; align-items: center; justify-content: center;
    background: #000; opacity: 1; transition: opacity 1.5s ease;
  }
  #title-card.hide { opacity: 0; pointer-events: none; }
  #title-card h1 {
    color: #a0c8ff; font-size: 36px; letter-spacing: 12px;
    text-shadow: 0 0 20px rgba(160, 200, 255, 0.3);
    animation: titlePulse 3s ease-in-out infinite;
  }
  #title-card .sub {
    color: rgba(160, 140, 200, 0.5); font-size: 14px;
    letter-spacing: 4px; margin-top: 12px; text-align: center;
  }
  @keyframes titlePulse {
    0%, 100% { text-shadow: 0 0 20px rgba(160, 200, 255, 0.3); }
    50% { text-shadow: 0 0 40px rgba(160, 200, 255, 0.5); }
  }
  #click-hint {
    position: absolute; bottom: 20%; left: 50%; transform: translateX(-50%);
    color: rgba(200, 180, 240, 0.4); font-size: 13px; letter-spacing: 2px;
    z-index: 16; animation: blink 2s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.7; }
  }

  #ending-text {
    position: absolute; bottom: 16%; left: 50%; transform: translateX(-50%);
    z-index: 5; text-align: center; pointer-events: none;
    opacity: 0; transition: opacity 1.5s ease;
  }
  #ending-text.show { opacity: 1; }
  #ending-text .line1 { color: rgba(200,180,240,0.5); font-size: 16px; letter-spacing: 4px; margin-bottom: 8px; }
  #ending-text .line2 { color: #a0c8ff; font-size: 22px; letter-spacing: 6px; text-shadow: 0 0 15px rgba(160,200,255,0.4); }
</style>
</head>
<body>
<div id="stage">
  <div class="bar top"></div>
  <div class="bar bottom"></div>

  <div id="progress"></div>

  <video id="v1" preload="auto" playsinline><source src="video/shot01-v7.mp4" type="video/mp4"></video>
  <video id="v2" preload="auto" playsinline><source src="video/shot02-v6.mp4" type="video/mp4"></video>
  <video id="v3" preload="auto" playsinline><source src="video/shot03-v6.mp4" type="video/mp4"></video>
  <video id="v4" preload="auto" playsinline><source src="video/shot04-v1.mp4" type="video/mp4"></video>
  <video id="v5" preload="auto" playsinline><source src="video/shot05-v5.mp4" type="video/mp4"></video>
  <video id="v6" preload="auto" playsinline><source src="video/shot06-v3.mp4" type="video/mp4"></video>

  <div id="ending-text">
    <div class="line1">星坠之渊，就在前方。</div>
    <div class="line2">摘星之旅，从这里开始。</div>
  </div>

  <div id="bgm-status">
    <div class="icon" id="bgm-icon"></div>
    <span id="bgm-label"> </span> 
  </div>

  <div id="title-card">
    <div>
      <h1>摘星之旅</h1>
      <div class="sub">点击屏幕开始</div>
    </div>
  </div>
  <div id="click-hint">点击任意位置开始播放</div>

  <div id="controls">
    <button id="btn-replay">重播</button>
    <button id="btn-skip">跳过 →</button>
  </div>
</div>

<script>
(function() {
  // 分镜定义：视频元素 + 配音时间轴（无画面字幕，独白走 vo/ 接口）
  const shots = [
    {
      el: document.getElementById('v1'),
      vo: [] // 第一幕无配音（待补）
    },
    {
      el: document.getElementById('v2'),
      vo: [] // 第二幕无配音（待补）
    },
    {
      el: document.getElementById('v3'),
      vo: [] // 精灵降临，纯BGM
    },
    {
      el: document.getElementById('v4'),
      vo: [] // 第四幕无配音（待补）
    },
    {
      el: document.getElementById('v5'),
      vo: [ { time: 0, audio: '../CG精灵1（第五幕）.mp3' } ] // 第五幕整段配音（露露），切幕即播
    },
    {
      el: document.getElementById('v6'),
      vo: [ { time: 0, audio: '../CG精灵2（第六幕）.mp3' } ] // 第六幕整段配音（露露），切幕即播
    },
  ];

  const titleCard = document.getElementById('title-card');
  const clickHint = document.getElementById('click-hint');
  const bgmIcon = document.getElementById('bgm-icon');
  const bgmLabel = document.getElementById('bgm-label');
  const endingText = document.getElementById('ending-text');
  const progressEl = document.getElementById('progress');

  // 进度点
  const dots = shots.map((_, i) => {
    const d = document.createElement('div');
    d.className = 'pd';
    progressEl.appendChild(d);
    return d;
  });

  let started = false;
  let voTimer = null;

  const bgm = new Audio();
  bgm.loop = true;
  bgm.volume = 0.25;
  bgm.src = 'audio/bgm.mp3';

  function setActiveDot(i) {
    dots.forEach((d, k) => d.classList.toggle('active', k === i));
  }

  function runVoice(video, timeline) {
    clearInterval(voTimer);
    const played = new Set();
    voTimer = setInterval(() => {
      const t = video.currentTime;
      timeline.forEach((e, i) => {
        if (t >= e.time && !played.has(i)) {
          played.add(i);
          const a = new Audio(e.audio);
          a.volume = 0.75;
          a.play().catch(() => {});
        }
      });
    }, 200);
  }

  function playShot(idx) {
    if (idx >= shots.length) { showEnding(); return; }
    const shot = shots[idx];
    setActiveDot(idx);

    // 隐藏其他
    shots.forEach((s, k) => s.el.classList.toggle('active', k === idx));

    const video = shot.el;
    video.currentTime = 0;
    video.play().then(() => runVoice(video, shot.vo))
      .catch(e => console.warn('Playback issue:', e));

    video.onended = () => {
      clearInterval(voTimer);
      // 淡黑过渡到下一镜
      video.classList.remove('active');
      setTimeout(() => playShot(idx + 1), 900);
    };
  }

  function showEnding() {
    setActiveDot(-1);
    endingText.classList.add('show');
    // 停留片刻后自动进入主页；也可点击立即进入
    setTimeout(goToTitle, 4200);
    document.getElementById('stage').addEventListener('click', goToTitle, { once: true });
    window.addEventListener('keydown', goToTitle, { once: true });
  }

  let navigated = false;
  function goToTitle() {
    if (navigated) return;
    navigated = true;
    document.body.style.transition = 'opacity 1.2s ease';
    document.body.style.opacity = '0';
    setTimeout(() => { window.location.href = '../title-screen/title.html'; }, 1100);
  }

  function startPlayback() {
    if (started) return;
    started = true;
    titleCard.classList.add('hide');
    clickHint.style.display = 'none';

    bgm.play().then(() => {
      bgmIcon.classList.add('playing');
      bgmLabel.textContent = 'BGM 播放中';
    }).catch(() => {
      bgmLabel.textContent = '';
    });

    setTimeout(() => playShot(0), 1500);
  }

  document.getElementById('stage').addEventListener('click', startPlayback);

  document.getElementById('btn-replay').addEventListener('click', (e) => {
    e.stopPropagation();
    shots.forEach(s => { s.el.pause(); s.el.currentTime = 0; s.el.classList.remove('active'); });
    endingText.classList.remove('show');
    clearInterval(voTimer);
    started = false;
    titleCard.classList.remove('hide');
    clickHint.style.display = 'block';
    setActiveDot(-1);
  });

  document.getElementById('btn-skip').addEventListener('click', (e) => {
    e.stopPropagation();
    shots.forEach(s => { s.el.pause(); s.el.classList.remove('active'); });
    clearInterval(voTimer);
    showEnding();
  });
})();
</script>
</body>
</html>
