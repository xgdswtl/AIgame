<!DOCTYPE html>
<!-- Generated by Trae Work -->
<!-- 用法：上传到 GitHub 仓库的 cg-opening/ 目录下，访问 cg-opening/opening-cg-player-v2.html 测试 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>摘星之旅 · 开场CG</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000; overflow: hidden;
    font-family: "PingFang SC", "SF Pro Text", system-ui, sans-serif;
    user-select: none;
  }
  #stage {
    position: relative; width: 100vw; height: 100vh; overflow: hidden;
    background: #000;
  }
  video {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    object-fit: cover; opacity: 0; transition: opacity 1s ease;
  }
  video.active { opacity: 1; }

  .bar {
    position: absolute; left: 0; width: 100%; height: 8%;
    background: #000; z-index: 3; pointer-events: none;
  }
  .bar.top { top: 0; }
  .bar.bottom { bottom: 0; }

  /* 预加载进度 */
  #preloader {
    position: absolute; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #000; transition: opacity 1s ease;
  }
  #preloader.hide { opacity: 0; pointer-events: none; }
  #preloader h2 {
    color: #a0c8ff; font-size: 20px; letter-spacing: 8px; margin-bottom: 24px;
    text-shadow: 0 0 15px rgba(160,200,255,.3);
  }
  #preloader .bar-wrap {
    width: 240px; height: 3px; background: rgba(160,140,200,.15); border-radius: 2px; overflow: hidden;
  }
  #preloader .bar-fill {
    height: 100%; width: 0%; background: linear-gradient(90deg, #6a8fff, #a0c8ff);
    box-shadow: 0 0 10px rgba(160,200,255,.5); transition: width .3s ease;
  }
  #preloader .tip {
    margin-top: 14px; font-size: 12px; color: rgba(160,140,200,.4); letter-spacing: 2px;
  }

  /* Progress */
  #progress {
    position: absolute; top: 50%; right: 28px; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 14px; z-index: 10;
  }
  #progress .pd {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(120,110,160,0.25); transition: all .35s;
  }
  #progress .pd.active { background: #a0c8ff; box-shadow: 0 0 10px #a0c8ff; transform: scale(1.3); }

  #bgm-status {
    position: absolute; top: 18px; right: 28px; z-index: 10;
    display: flex; align-items: center; gap: 8px;
    color: rgba(160, 140, 200, 0.6); font-size: 12px; letter-spacing: 1px;
  }
  #bgm-status .icon {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid rgba(160, 140, 200, 0.3);
  }
  #bgm-status .icon.playing {
    border-color: #a0c8ff; animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(160, 200, 255, 0.3); }
    50% { box-shadow: 0 0 0 6px rgba(160, 200, 255, 0); }
  }

  #controls {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 12px; z-index: 20;
    opacity: 0.3; transition: opacity 0.3s;
  }
  #controls:hover { opacity: 1; }
  #controls button {
    background: rgba(20, 16, 40, 0.85); color: #a0c8ff;
    border: 1px solid #2a2860; padding: 8px 20px;
    border-radius: 20px; cursor: pointer; font-size: 13px;
    letter-spacing: 1px; transition: all 0.3s;
  }
  #controls button:hover { background: #2a2860; }

  #title-card {
    position: absolute; inset: 0;
    z-index: 15; display: flex; align-items: center; justify-content: center;
    background: #000; opacity: 0; pointer-events: none; transition: opacity 1.5s ease;
  }
  #title-card.show { opacity: 1; pointer-events: auto; }
  #title-card h1 {
    color: #a0c8ff; font-size: 36px; letter-spacing: 12px;
    text-shadow: 0 0 20px rgba(160, 200, 255, 0.3);
    animation: titlePulse 3s ease-in-out infinite;
  }
  #title-card .sub {
    color: rgba(160, 140, 200, 0.5); font-size: 14px;
    letter-spacing: 4px; margin-top: 12px; text-align: center;
  }
  @keyframes titlePulse {
    0%, 100% { text-shadow: 0 0 20px rgba(160, 200, 255, 0.3); }
    50% { text-shadow: 0 0 40px rgba(160, 200, 255, 0.5); }
  }
  #click-hint {
    position: absolute; bottom: 20%; left: 50%; transform: translateX(-50%);
    color: rgba(200, 180, 240, 0.4); font-size: 13px; letter-spacing: 2px;
    z-index: 16; animation: blink 2s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.7; }
  }

  #ending-text {
    position: absolute; bottom: 16%; left: 50%; transform: translateX(-50%);
    z-index: 5; text-align: center; pointer-events: none;
    opacity: 0; transition: opacity 1.5s ease;
  }
  #ending-text.show { opacity: 1; }
  #ending-text .line1 { color: rgba(200,180,240,0.5); font-size: 16px; letter-spacing: 4px; margin-bottom: 8px; }
  #ending-text .line2 { color: #a0c8ff; font-size: 22px; letter-spacing: 6px; text-shadow: 0 0 15px rgba(160,200,255,0.4); }
</style>
</head>
<body>
<div id="stage">
  <div class="bar top"></div>
  <div class="bar bottom"></div>

  <!-- 预加载进度 -->
  <div id="preloader">
    <h2>正在加载</h2>
    <div class="bar-wrap"><div class="bar-fill" id="load-bar"></div></div>
    <div class="tip" id="load-tip">视频缓冲中…</div>
  </div>

  <div id="progress"></div>

  <video id="v1" preload="auto" playsinline muted><source src="video/shot01-v7.mp4.mp4" type="video/mp4"></video>
  <video id="v2" preload="auto" playsinline><source src="video/shot02-v6.mp4.mp4" type="video/mp4"></video>
  <video id="v3" preload="auto" playsinline><source src="video/shot03-v6.mp4.mp4" type="video/mp4"></video>
  <video id="v4" preload="auto" playsinline><source src="video/shot04-v1.mp4.mp4" type="video/mp4"></video>
  <video id="v5" preload="auto" playsinline><source src="video/shot05-v5.mp4.mp4" type="video/mp4"></video>
  <video id="v6" preload="auto" playsinline><source src="video/shot06-v3.mp4.mp4" type="video/mp4"></video>

  <div id="ending-text">
    <div class="line1">星坠之渊，就在前方。</div>
    <div class="line2">摘星之旅，从这里开始。</div>
  </div>

  <div id="bgm-status">
    <div class="icon" id="bgm-icon"></div>
    <span id="bgm-label"> </span>
  </div>

  <div id="title-card" class="show">
    <div>
      <h1>摘星之旅</h1>
      <div class="sub">加载完成 · 点击屏幕开始</div>
    </div>
  </div>
  <div id="click-hint" style="display:none">点击任意位置开始播放</div>

  <div id="controls">
    <button id="btn-replay">重播</button>
    <button id="btn-skip">跳过 →</button>
  </div>
</div>

<script>
(function() {
  // 分镜定义：视频元素 + 配音时间轴
  const shots = [
    { id: 'v1', vo: [] },
    { id: 'v2', vo: [] },
    { id: 'v3', vo: [] },
    { id: 'v4', vo: [] },
    { id: 'v5', vo: [ { time: 0, audio: '../CG精灵1（第五幕）.mp3' } ] },
    { id: 'v6', vo: [ { time: 0, audio: '../CG精灵2（第六幕）.mp3' } ] },
  ];

  shots.forEach(s => { s.el = document.getElementById(s.id); });

  const preloader = document.getElementById('preloader');
  const loadBar = document.getElementById('load-bar');
  const loadTip = document.getElementById('load-tip');
  const titleCard = document.getElementById('title-card');
  const clickHint = document.getElementById('click-hint');
  const bgmIcon = document.getElementById('bgm-icon');
  const bgmLabel = document.getElementById('bgm-label');
  const endingText = document.getElementById('ending-text');
  const progressEl = document.getElementById('progress');

  // 进度点
  const dots = shots.map((_, i) => {
    const d = document.createElement('div');
    d.className = 'pd';
    progressEl.appendChild(d);
    return d;
  });

  let started = false;
  let voTimer = null;
  let currentIdx = 0;

  const bgm = new Audio();
  bgm.loop = true;
  bgm.volume = 0.25;
  bgm.src = 'audio/bgm.mp3';

  function setActiveDot(i) {
    dots.forEach((d, k) => d.classList.toggle('active', k === i));
  }

  // ========== 预加载逻辑 ==========
  let loadedCount = 0;
  const total = shots.length;

  function updateProgress() {
    const pct = Math.round((loadedCount / total) * 100);
    loadBar.style.width = pct + '%';
    loadTip.textContent = '视频缓冲中… ' + pct + '%';
  }

  // 每个视频加载到 50% 就算就绪（足够播放完了）
  shots.forEach((shot, idx) => {
    const v = shot.el;
    // 触发加载
    v.load();

    const check = () => {
      if (v.buffered.length > 0) {
        const buffered = v.buffered.end(v.buffered.length - 1);
        const duration = v.duration;
        if (duration > 0 && buffered >= duration * 0.5) {
          // 这一镜缓冲足够了
          if (!shot._ready) {
            shot._ready = true;
            loadedCount++;
            updateProgress();
            // 第一镜就绪后，开始加载下一镜（级联预加载）
            // 这里所有视频并行加载，因为 preload=auto
          }
        }
      }
    };

    v.addEventListener('progress', check);
    v.addEventListener('canplaythrough', () => {
      if (!shot._ready) {
        shot._ready = true;
        loadedCount++;
        updateProgress();
      }
    });
    v.addEventListener('error', () => {
      // 加载失败也计数，避免卡死在 0%
      if (!shot._ready) {
        shot._ready = true;
        loadedCount++;
        updateProgress();
        console.warn('视频加载失败:', shot.id);
      }
    });
  });

  // 检测所有就绪（或超时后强制进入）
  let preloadTimeout = setTimeout(() => {
    // 最多等 15 秒，超时直接进（网速慢的时候不让用户一直等）
    if (!started) {
      finishPreload();
    }
  }, 15000);

  let preloadCheck = setInterval(() => {
    if (loadedCount >= total) {
      clearInterval(preloadCheck);
      clearTimeout(preloadTimeout);
      finishPreload();
    }
  }, 300);

  function finishPreload() {
    if (preloader.classList.contains('hide')) return;
    preloader.classList.add('hide');
    titleCard.classList.add('show');
    clickHint.style.display = 'block';
    // 取消静音，等用户点击后播放
    shots.forEach(s => { s.el.muted = false; });
  }

  // ========== 播放逻辑 ==========
  function runVoice(video, timeline) {
    clearInterval(voTimer);
    const played = new Set();
    voTimer = setInterval(() => {
      const t = video.currentTime;
      timeline.forEach((e, i) => {
        if (t >= e.time && !played.has(i)) {
          played.add(i);
          const a = new Audio(e.audio);
          a.volume = 0.75;
          a.play().catch(() => {});
        }
      });
    }, 200);
  }

  function playShot(idx) {
    if (idx >= shots.length) { showEnding(); return; }
    currentIdx = idx;
    const shot = shots[idx];
    setActiveDot(idx);

    // 隐藏其他
    shots.forEach((s, k) => s.el.classList.toggle('active', k === idx));

    const video = shot.el;
    video.currentTime = 0;
    const p = video.play();
    if (p && p.then) {
      p.then(() => runVoice(video, shot.vo))
       .catch(e => console.warn('Playback issue:', e));
    } else {
      runVoice(video, shot.vo);
    }

    video.onended = () => {
      clearInterval(voTimer);
      // 淡黑过渡到下一镜
      video.classList.remove('active');
      setTimeout(() => playShot(idx + 1), 900);
    };

    // 后台预加载下一镜（确保下一镜缓冲更多）
    const next = shots[idx + 1];
    if (next && next.el) {
      try { next.el.load(); } catch(e) {}
    }
  }

  function showEnding() {
    setActiveDot(-1);
    endingText.classList.add('show');
    setTimeout(goToTitle, 4200);
    document.getElementById('stage').addEventListener('click', goToTitle, { once: true });
    window.addEventListener('keydown', goToTitle, { once: true });
  }

  let navigated = false;
  function goToTitle() {
    if (navigated) return;
    navigated = true;
    document.body.style.transition = 'opacity 1.2s ease';
    document.body.style.opacity = '0';
    setTimeout(() => { window.location.href = '../title-screen/title.html'; }, 1100);
  }

  function startPlayback() {
    if (started) return;
    if (!preloader.classList.contains('hide')) return; // 还在加载中
    started = true;
    titleCard.classList.remove('show');
    clickHint.style.display = 'none';

    bgm.play().then(() => {
      bgmIcon.classList.add('playing');
      bgmLabel.textContent = 'BGM 播放中';
    }).catch(() => {
      bgmLabel.textContent = '';
    });

    setTimeout(() => playShot(0), 1500);
  }

  document.getElementById('stage').addEventListener('click', startPlayback);

  document.getElementById('btn-replay').addEventListener('click', (e) => {
    e.stopPropagation();
    shots.forEach(s => { s.el.pause(); s.el.currentTime = 0; s.el.classList.remove('active'); });
    endingText.classList.remove('show');
    clearInterval(voTimer);
    started = false;
    currentIdx = 0;
    titleCard.classList.add('show');
    clickHint.style.display = 'block';
    setActiveDot(-1);
  });

  document.getElementById('btn-skip').addEventListener('click', (e) => {
    e.stopPropagation();
    shots.forEach(s => { s.el.pause(); s.el.classList.remove('active'); });
    clearInterval(voTimer);
    showEnding();
  });
})();
</script>
</body>
</html>
