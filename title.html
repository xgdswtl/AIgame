<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>摘星之旅 · 主页</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0a0820; }
  body {
    font-family: "ZCOOL XiaoWei", "PingFang SC", "Songti SC", serif;
    user-select: none;
    color: #eef;
  }
  #stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; }

  /* 背景插画 */
  #bg {
    position: absolute; inset: 0;
    background: url('assets/title-bg-v2.jpg') center/cover no-repeat;
    transform: scale(1.05);
    animation: bgDrift 30s ease-in-out infinite alternate;
    opacity: 0;
    transition: opacity 2s ease;
  }
  #bg.ready { opacity: 1; }
  @keyframes bgDrift {
    from { transform: scale(1.05) translate(0, 0); }
    to   { transform: scale(1.1) translate(-1.5%, -1%); }
  }
  #veil {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 50% 42%, rgba(10,8,32,0) 30%, rgba(10,8,32,0.45) 100%),
      linear-gradient(to bottom, rgba(8,6,26,0.72) 0%, rgba(8,6,26,0.15) 30%, rgba(8,6,26,0.05) 55%, rgba(8,6,26,0.55) 100%);
  }
  #fx { position: absolute; inset: 0; z-index: 2; pointer-events: none; }

  /* 标题 */
  #title-wrap {
    position: absolute; top: 12%; left: 0; width: 100%;
    text-align: center; z-index: 5;
    opacity: 0; transform: translateY(-14px);
    transition: opacity 2s ease 0.6s, transform 2s ease 0.6s;
  }
  #title-wrap.show { opacity: 1; transform: translateY(0); }
  #game-title {
    font-family: "ZCOOL XiaoWei", "Songti SC", serif;
    font-size: clamp(48px, 9vw, 108px);
    letter-spacing: 0.35em;
    margin-left: 0.35em;
    color: #f3efff;
    text-shadow:
      0 0 18px rgba(190, 170, 255, 0.75),
      0 0 42px rgba(140, 170, 255, 0.45),
      0 2px 6px rgba(0,0,0,0.5);
    animation: titleGlow 4s ease-in-out infinite;
  }
  @keyframes titleGlow {
    0%, 100% { text-shadow: 0 0 18px rgba(190,170,255,0.7), 0 0 42px rgba(140,170,255,0.4), 0 2px 6px rgba(0,0,0,0.5); }
    50%      { text-shadow: 0 0 26px rgba(210,190,255,0.95), 0 0 64px rgba(160,190,255,0.6), 0 2px 6px rgba(0,0,0,0.5); }
  }
  #game-sub {
    font-family: "Cinzel", serif;
    font-size: clamp(12px, 1.6vw, 18px);
    letter-spacing: 0.55em;
    margin-left: 0.55em;
    margin-top: 14px;
    color: rgba(200, 195, 235, 0.75);
    text-shadow: 0 0 12px rgba(150,160,255,0.4);
  }
  #title-rule {
    width: 0; height: 1px; margin: 20px auto 0;
    background: linear-gradient(to right, transparent, rgba(200,195,235,0.7), transparent);
    transition: width 2.2s ease 1.4s;
  }
  #title-rule.show { width: min(380px, 60vw); }

  /* 底部开始区 */
  #start-area {
    position: absolute; bottom: 12%; left: 0; width: 100%;
    text-align: center; z-index: 5;
    opacity: 0; transition: opacity 1.6s ease 2s;
  }
  #start-area.show { opacity: 1; }
  #start-btn {
    font-family: "ZCOOL XiaoWei", "Songti SC", serif;
    font-size: clamp(20px, 2.6vw, 30px);
    letter-spacing: 0.4em;
    margin-left: 0.4em;
    color: #f5f1ff;
    background: rgba(30, 24, 66, 0.35);
    border: 1px solid rgba(190, 175, 255, 0.55);
    border-radius: 40px;
    padding: 14px 52px;
    cursor: pointer;
    backdrop-filter: blur(4px);
    box-shadow: 0 0 22px rgba(150, 140, 255, 0.25), inset 0 0 18px rgba(170,160,255,0.12);
    transition: all 0.35s ease;
  }
  #start-btn:hover {
    background: rgba(60, 48, 120, 0.5);
    border-color: rgba(220, 210, 255, 0.9);
    box-shadow: 0 0 34px rgba(180, 170, 255, 0.5), inset 0 0 24px rgba(190,180,255,0.25);
    transform: translateY(-2px);
  }
  #prologue-link {
    display: block; margin: 22px auto 0;
    background: none; border: none; cursor: pointer;
    font-family: "ZCOOL XiaoWei", "Songti SC", serif;
    font-size: clamp(14px, 1.7vw, 18px);
    letter-spacing: 0.25em;
    color: rgba(200, 195, 235, 0.6);
    text-shadow: 0 0 10px rgba(150,160,255,0.3);
    transition: color 0.3s, text-shadow 0.3s;
  }
  #prologue-link:hover {
    color: rgba(235, 230, 255, 0.95);
    text-shadow: 0 0 16px rgba(180,190,255,0.6);
  }

  /* 右上角设置按钮 */
  #settings-btn {
    position: absolute; top: 26px; right: 26px; z-index: 8;
    width: 46px; height: 46px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(24, 20, 54, 0.4);
    border: 1px solid rgba(190, 175, 255, 0.35);
    color: rgba(220, 215, 245, 0.85);
    cursor: pointer; backdrop-filter: blur(6px);
    transition: transform 0.5s ease, background 0.3s, box-shadow 0.3s;
  }
  #settings-btn:hover {
    background: rgba(50, 42, 100, 0.55);
    box-shadow: 0 0 20px rgba(160,150,255,0.4);
    transform: rotate(90deg);
  }
  #settings-btn svg { width: 22px; height: 22px; }

  /* 设置遮罩 + 面板 */
  #settings-overlay {
    position: absolute; inset: 0; z-index: 9;
    background: rgba(8, 6, 22, 0.55);
    backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.35s ease;
  }
  #settings-overlay.open { opacity: 1; pointer-events: auto; }
  #settings-panel {
    width: min(380px, 88vw);
    background: linear-gradient(160deg, rgba(34, 28, 72, 0.92), rgba(20, 16, 48, 0.94));
    border: 1px solid rgba(170, 155, 235, 0.35);
    border-radius: 18px;
    padding: 26px 28px 24px;
    box-shadow: 0 18px 60px rgba(0,0,0,0.55), 0 0 40px rgba(140,130,255,0.18), inset 0 0 30px rgba(150,140,255,0.06);
    transform: translateY(14px) scale(0.97);
    transition: transform 0.35s cubic-bezier(.2,.8,.3,1);
  }
  #settings-overlay.open #settings-panel { transform: translateY(0) scale(1); }
  #settings-panel h2 {
    font-family: "ZCOOL XiaoWei", "Songti SC", serif;
    font-size: 24px; letter-spacing: 0.3em; margin-left: 0.3em;
    color: #efeaff; text-align: center; font-weight: normal;
    text-shadow: 0 0 14px rgba(180,170,255,0.5);
  }
  .setting-row { margin-top: 22px; }
  .setting-label {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 16px; letter-spacing: 0.15em;
    color: rgba(220, 215, 245, 0.9); margin-bottom: 10px;
  }
  .setting-label .val {
    font-family: "Cinzel", serif; font-size: 13px; letter-spacing: 1px;
    color: rgba(170, 190, 255, 0.85);
  }
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px; border-radius: 4px;
    background: linear-gradient(to right, rgba(170,160,255,0.8) var(--fill,60%), rgba(255,255,255,0.12) var(--fill,60%));
    outline: none; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: #e6e0ff;
    box-shadow: 0 0 10px rgba(180,170,255,0.9), 0 0 4px rgba(255,255,255,0.8);
    border: none; cursor: pointer;
    transition: transform 0.2s;
  }
  input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }
  input[type="range"]::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%;
    background: #e6e0ff; border: none; cursor: pointer;
    box-shadow: 0 0 10px rgba(180,170,255,0.9);
  }
  .setting-divider {
    height: 1px; margin: 24px 0 4px;
    background: linear-gradient(to right, transparent, rgba(180,170,240,0.3), transparent);
  }
  .panel-btn {
    width: 100%; margin-top: 14px;
    font-family: "ZCOOL XiaoWei", "Songti SC", serif;
    font-size: 16px; letter-spacing: 0.25em; margin-left: 0.25em;
    color: #ece6ff;
    background: rgba(46, 38, 96, 0.5);
    border: 1px solid rgba(170, 155, 235, 0.4);
    border-radius: 26px; padding: 11px 0;
    cursor: pointer; backdrop-filter: blur(4px);
    transition: all 0.3s;
  }
  .panel-btn:hover {
    background: rgba(70, 58, 130, 0.6);
    border-color: rgba(215, 205, 255, 0.8);
    box-shadow: 0 0 18px rgba(160,150,255,0.35);
  }
  #settings-close {
    position: absolute; top: 14px; right: 16px;
    background: none; border: none; cursor: pointer;
    color: rgba(200,195,235,0.6); font-size: 24px; line-height: 1;
    width: 32px; height: 32px; border-radius: 50%;
    transition: color 0.3s, background 0.3s;
  }
  #settings-close:hover { color: #fff; background: rgba(255,255,255,0.08); }

  /* 帮助按钮（齿轮下方） */
  #help-btn {
    position: absolute; top: 84px; right: 26px; z-index: 8;
    width: 46px; height: 46px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(24, 20, 54, 0.4);
    border: 1px solid rgba(190, 175, 255, 0.35);
    color: rgba(220, 215, 245, 0.85);
    cursor: pointer; backdrop-filter: blur(6px);
    transition: background 0.3s, box-shadow 0.3s, transform 0.3s;
    font-family: "Cinzel", serif; font-size: 22px;
  }
  #help-btn:hover {
    background: rgba(50, 42, 100, 0.55);
    box-shadow: 0 0 20px rgba(160,150,255,0.4);
    transform: translateY(-2px);
  }

  /* 操作说明翻页面板 */
  #help-overlay {
    position: absolute; inset: 0; z-index: 9;
    background: rgba(8, 6, 22, 0.55);
    backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.35s ease;
  }
  #help-overlay.open { opacity: 1; pointer-events: auto; }
  #help-panel {
    position: relative;
    width: min(440px, 90vw);
    background: linear-gradient(160deg, rgba(34, 28, 72, 0.92), rgba(20, 16, 48, 0.94));
    border: 1px solid rgba(170, 155, 235, 0.35);
    border-radius: 18px;
    padding: 30px 30px 24px;
    box-shadow: 0 18px 60px rgba(0,0,0,0.55), 0 0 40px rgba(140,130,255,0.18);
    transform: translateY(14px) scale(0.97);
    transition: transform 0.35s cubic-bezier(.2,.8,.3,1);
  }
  #help-overlay.open #help-panel { transform: translateY(0) scale(1); }
  #help-title {
    font-size: 22px; letter-spacing: 0.3em; margin-left: 0.3em;
    color: #efeaff; text-align: center; font-weight: normal;
    text-shadow: 0 0 14px rgba(180,170,255,0.5);
  }
  .help-page {
    min-height: 250px; margin-top: 26px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; gap: 22px;
  }
  .help-visual {
    height: 96px; display: flex; align-items: center; justify-content: center;
  }
  .help-visual svg { width: 88px; height: 88px; filter: drop-shadow(0 0 12px rgba(170,160,255,0.5)); }
  .key-row { display: flex; gap: 10px; }
  .keycap {
    min-width: 52px; height: 52px; padding: 0 12px;
    display: flex; align-items: center; justify-content: center;
    font-family: "Cinzel", serif; font-size: 22px; color: #e6e0ff;
    background: linear-gradient(180deg, rgba(60,50,120,0.7), rgba(34,28,72,0.8));
    border: 1px solid rgba(190,175,255,0.45);
    border-radius: 12px;
    box-shadow: 0 4px 0 rgba(20,16,48,0.9), 0 0 16px rgba(150,140,255,0.25);
  }
  .help-text {
    font-size: 17px; line-height: 2; letter-spacing: 0.12em;
    color: rgba(225, 220, 245, 0.92);
  }
  .help-nav {
    margin-top: 26px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .help-arrow {
    width: 42px; height: 42px; border-radius: 50%;
    background: rgba(46, 38, 96, 0.5);
    border: 1px solid rgba(170, 155, 235, 0.4);
    color: #e6e0ff; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s;
  }
  .help-arrow:hover:not(:disabled) {
    background: rgba(70, 58, 130, 0.65);
    box-shadow: 0 0 16px rgba(160,150,255,0.4);
  }
  .help-arrow:disabled { opacity: 0.25; cursor: default; }
  .help-dots { display: flex; gap: 9px; }
  .help-dots .d {
    width: 9px; height: 9px; border-radius: 50%;
    background: rgba(180, 175, 215, 0.25);
    transition: all 0.3s;
  }
  .help-dots .d.active {
    background: #cfc6ff;
    box-shadow: 0 0 10px rgba(190,180,255,0.9);
    transform: scale(1.25);
  }
  #help-close {
    position: absolute; top: 12px; right: 14px;
    background: none; border: none; cursor: pointer;
    color: rgba(200,195,235,0.6); font-size: 24px; line-height: 1;
    width: 32px; height: 32px; border-radius: 50%;
    transition: color 0.3s, background 0.3s;
  }
  #help-close:hover { color: #fff; background: rgba(255,255,255,0.08); }

  /* 选关界面 */
  #level-overlay {
    position: absolute; inset: 0; z-index: 10;
    background: radial-gradient(ellipse at 50% 0%, #1c1547 0%, #0e0a28 55%, #080618 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.5s ease;
  }
  #level-overlay.open { opacity: 1; pointer-events: auto; }
  #level-title {
    font-size: clamp(28px, 4vw, 40px);
    letter-spacing: 0.35em; margin-left: 0.35em;
    color: #efeaff; font-weight: normal;
    text-shadow: 0 0 18px rgba(180,170,255,0.6);
    opacity: 0; transform: translateY(-10px);
    transition: opacity 0.8s ease 0.15s, transform 0.8s ease 0.15s;
  }
  #level-overlay.open #level-title { opacity: 1; transform: translateY(0); }
  #level-cards {
    display: flex; gap: clamp(24px, 5vw, 56px);
    margin-top: clamp(40px, 7vh, 70px);
    flex-wrap: wrap; justify-content: center;
  }
  .level-item {
    display: flex; flex-direction: column; align-items: center;
    opacity: 0; transform: translateY(18px);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }
  #level-overlay.open .level-item { opacity: 1; transform: translateY(0); }
  #level-overlay.open .level-item:nth-child(1) { transition-delay: 0.3s; }
  #level-overlay.open .level-item:nth-child(2) { transition-delay: 0.45s; }
  #level-overlay.open .level-item:nth-child(3) { transition-delay: 0.6s; }
  .level-card {
    width: clamp(104px, 14vw, 138px); height: clamp(104px, 14vw, 138px);
    border-radius: 26px;
    display: flex; align-items: center; justify-content: center;
    font-family: "Cinzel", serif; font-size: clamp(44px, 6vw, 58px);
    transition: all 0.35s ease;
  }
  .level-card svg { width: 44px; height: 44px; }
  .level-item.open .level-card {
    background: linear-gradient(160deg, rgba(56, 46, 118, 0.75), rgba(30, 24, 68, 0.85));
    border: 1px solid rgba(190, 175, 255, 0.55);
    color: #f0ebff;
    box-shadow: 0 0 26px rgba(150, 140, 255, 0.28), inset 0 0 22px rgba(170,160,255,0.12);
    cursor: pointer;
  }
  .level-item.open .level-card:hover {
    transform: translateY(-5px);
    border-color: rgba(225, 215, 255, 0.95);
    box-shadow: 0 0 42px rgba(180, 170, 255, 0.55), inset 0 0 28px rgba(190,180,255,0.2);
  }
  .level-item.locked .level-card {
    background: rgba(22, 19, 44, 0.7);
    border: 1px solid rgba(120, 115, 160, 0.25);
    color: rgba(150, 145, 185, 0.45);
    cursor: not-allowed;
  }
  .level-name {
    margin-top: 16px;
    font-size: clamp(14px, 1.8vw, 17px);
    letter-spacing: 0.25em; margin-left: 0.25em;
    color: rgba(205, 200, 238, 0.75);
  }
  .level-item.locked .level-name { color: rgba(140, 135, 175, 0.4); }
  #level-back {
    margin-top: clamp(44px, 8vh, 80px);
    font-family: "ZCOOL XiaoWei", "Songti SC", serif;
    font-size: 17px; letter-spacing: 0.3em; margin-left: 0.3em;
    color: rgba(200, 195, 235, 0.65);
    background: none; border: none; cursor: pointer;
    padding: 8px 20px;
    transition: color 0.3s, text-shadow 0.3s;
  }
  #level-back:hover {
    color: rgba(240, 235, 255, 0.95);
    text-shadow: 0 0 14px rgba(180,190,255,0.6);
  }

  /* 焦点可达性 */
  button:focus-visible, input:focus-visible {
    outline: 2px solid rgba(190, 205, 255, 0.9);
    outline-offset: 3px;
  }

  #version {
    position: absolute; bottom: 18px; right: 22px; z-index: 5;
    font-family: "Cinzel", serif; font-size: 11px; letter-spacing: 2px;
    color: rgba(180, 175, 215, 0.4);
  }

  /* 降低动效偏好 */
  @media (prefers-reduced-motion: reduce) {
    #bg { animation: none; }
    #game-title { animation: none; }
    * { transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="veil"></div>
  <canvas id="fx"></canvas>

  <div id="title-wrap">
    <div id="game-title">摘星之旅</div>
    <div id="game-sub">JOURNEY TO THE STARS</div>
    <div id="title-rule"></div>
  </div>

  <div id="start-area">
    <button id="start-btn">开始游戏</button>
    <button id="prologue-link">观看序章</button>
  </div>

  <button id="settings-btn" aria-label="设置" title="设置">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3.2"/>
      <path d="M19.4 15a1.6 1.6 0 0 0 .32 1.76l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.6 1.6 0 0 0-1.76-.32 1.6 1.6 0 0 0-.97 1.47V21a2 2 0 1 1-4 0v-.09a1.6 1.6 0 0 0-1.05-1.47 1.6 1.6 0 0 0-1.76.32l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.6 1.6 0 0 0 .32-1.76 1.6 1.6 0 0 0-1.47-.97H3a2 2 0 1 1 0-4h.09A1.6 1.6 0 0 0 4.56 9a1.6 1.6 0 0 0-.32-1.76l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.6 1.6 0 0 0 1.76.32H9a1.6 1.6 0 0 0 .97-1.47V3a2 2 0 1 1 4 0v.09a1.6 1.6 0 0 0 .97 1.47 1.6 1.6 0 0 0 1.76-.32l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.6 1.6 0 0 0-.32 1.76V9a1.6 1.6 0 0 0 1.47.97H21a2 2 0 1 1 0 4h-.09a1.6 1.6 0 0 0-1.47.97z"/>
    </svg>
  </button>

  <button id="help-btn" aria-label="操作说明" title="操作说明">?</button>

  <div id="help-overlay" role="dialog" aria-modal="true" aria-label="操作说明">
    <div id="help-panel">
      <button id="help-close" aria-label="关闭说明">&times;</button>
      <div id="help-title">操作说明</div>
      <div class="help-page" id="help-page"></div>
      <div class="help-nav">
        <button class="help-arrow" id="help-prev" aria-label="上一页">‹</button>
        <div class="help-dots" id="help-dots"></div>
        <button class="help-arrow" id="help-next" aria-label="下一页">›</button>
      </div>
    </div>
  </div>

  <div id="level-overlay" role="dialog" aria-modal="true" aria-label="选择关卡">
    <div id="level-title">选择关卡</div>
    <div id="level-cards"></div>
    <button id="level-back">返回</button>
  </div>

  <div id="settings-overlay" role="dialog" aria-modal="true" aria-label="设置">
    <div id="settings-panel">
      <button id="settings-close" aria-label="关闭设置">&times;</button>
      <h2>设置</h2>

      <div class="setting-row">
        <div class="setting-label"><span>音乐</span><span class="val" id="bgm-val">60</span></div>
        <input type="range" id="bgm-vol" min="0" max="100" value="60" aria-label="音乐音量">
      </div>

      <div class="setting-row">
        <div class="setting-label"><span>音效</span><span class="val" id="sfx-val">70</span></div>
        <input type="range" id="sfx-vol" min="0" max="100" value="70" aria-label="音效音量">
      </div>

      <div class="setting-divider"></div>

      <button class="panel-btn" id="fullscreen-btn">全屏</button>
      <button class="panel-btn" id="replay-prologue-btn">观看序章</button>
    </div>
  </div>

  <div id="version">DEMO · v0.1</div>
</div>

<script>
(function() {
  const bg = document.getElementById('bg');
  const titleWrap = document.getElementById('title-wrap');
  const rule = document.getElementById('title-rule');
  const startArea = document.getElementById('start-area');
  const startBtn = document.getElementById('start-btn');
  const prologueLink = document.getElementById('prologue-link');

  // ---------- 背景淡入 ----------
  const preload = new Image();
  preload.onload = () => {
    bg.classList.add('ready');
    titleWrap.classList.add('show');
    rule.classList.add('show');
    startArea.classList.add('show');
  };
  preload.src = 'assets/title-bg-v2.jpg';

  // ---------- 星光粒子 ----------
  const cv = document.getElementById('fx');
  const ctx = cv.getContext('2d');
  let W, H, stars = [];
  function resize() { W = cv.width = window.innerWidth; H = cv.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  for (let i = 0; i < 70; i++) {
    stars.push({
      x: Math.random(), y: Math.random(),
      r: Math.random() * 1.8 + 0.4,
      tw: Math.random() * Math.PI * 2,
      sp: Math.random() * 0.02 + 0.005,
      drift: Math.random() * 0.0004 + 0.0001,
      hue: Math.random() < 0.7 ? '210,225,255' : '255,210,235'
    });
  }
  function tick() {
    ctx.clearRect(0, 0, W, H);
    for (const s of stars) {
      s.tw += s.sp; s.y -= s.drift;
      if (s.y < -0.02) s.y = 1.02;
      const a = 0.35 + Math.sin(s.tw) * 0.3;
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${s.hue},${a})`;
      ctx.shadowBlur = 8; ctx.shadowColor = `rgba(${s.hue},${a})`;
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    requestAnimationFrame(tick);
  }
  tick();

  // ---------- 音频系统 ----------
  const store = {
    get bgm() { return parseFloat(localStorage.getItem('zxz_bgm') ?? '0.6'); },
    set bgm(v) { localStorage.setItem('zxz_bgm', v); },
    get sfx() { return parseFloat(localStorage.getItem('zxz_sfx') ?? '0.7'); },
    set sfx(v) { localStorage.setItem('zxz_sfx', v); }
  };

  // BGM（预留素材，缺失时静默）
  const bgmAudio = new Audio('audio/bgm.mp3');
  bgmAudio.loop = true;
  bgmAudio.volume = store.bgm;
  let bgmTried = false;
  function tryStartBgm() {
    if (bgmTried) return;
    bgmTried = true;
    bgmAudio.play().catch(() => {});
  }

  // 音效：WebAudio 生成轻柔“星音”，无需素材
  let actx = null;
  function playChime() {
    const vol = store.sfx;
    if (vol <= 0) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const now = actx.currentTime;
      [880, 1320].forEach((f, i) => {
        const o = actx.createOscillator();
        const g = actx.createGain();
        o.type = 'sine';
        o.frequency.value = f;
        g.gain.setValueAtTime(0, now);
        g.gain.linearRampToValueAtTime(0.12 * vol, now + 0.02 + i * 0.05);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.9);
        o.connect(g); g.connect(actx.destination);
        o.start(now); o.stop(now + 1);
      });
    } catch (e) {}
  }

  // ---------- 设置面板 ----------
  const overlay = document.getElementById('settings-overlay');
  const settingsBtn = document.getElementById('settings-btn');
  const closeBtn = document.getElementById('settings-close');
  const bgmSlider = document.getElementById('bgm-vol');
  const sfxSlider = document.getElementById('sfx-vol');
  const bgmVal = document.getElementById('bgm-val');
  const sfxVal = document.getElementById('sfx-val');
  const fsBtn = document.getElementById('fullscreen-btn');
  const replayBtn = document.getElementById('replay-prologue-btn');

  function paintSlider(el) {
    el.style.setProperty('--fill', el.value + '%');
  }
  function initSlider(el, valEl, key, onChange) {
    el.value = Math.round(store[key] * 100);
    valEl.textContent = el.value;
    paintSlider(el);
    el.addEventListener('input', () => {
      const v = el.value / 100;
      store[key] = v;
      valEl.textContent = el.value;
      paintSlider(el);
      onChange(v);
      if (key === 'sfx') playChime();
    });
  }
  initSlider(bgmSlider, bgmVal, 'bgm', v => { bgmAudio.volume = v; tryStartBgm(); });
  initSlider(sfxSlider, sfxVal, 'sfx', () => {});

  function openSettings() {
    overlay.classList.add('open');
    tryStartBgm(); playChime();
  }
  function closeSettings() { overlay.classList.remove('open'); playChime(); }
  settingsBtn.addEventListener('click', (e) => { e.stopPropagation(); openSettings(); });
  closeBtn.addEventListener('click', (e) => { e.stopPropagation(); closeSettings(); });
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeSettings(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (overlay.classList.contains('open')) closeSettings();
      else if (helpOverlay.classList.contains('open')) closeHelp();
      else if (levelOverlay.classList.contains('open')) closeLevelSelect();
    }
  });

  // 全屏
  function updateFsBtn() {
    fsBtn.textContent = document.fullscreenElement ? '退出全屏' : '全屏';
  }
  fsBtn.addEventListener('click', () => {
    playChime();
    if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    else document.documentElement.requestFullscreen().catch(()=>{});
  });
  document.addEventListener('fullscreenchange', updateFsBtn);

  // ---------- 操作说明（翻页） ----------
  const helpOverlay = document.getElementById('help-overlay');
  const helpBtn = document.getElementById('help-btn');
  const helpClose = document.getElementById('help-close');
  const helpPage = document.getElementById('help-page');
  const helpDots = document.getElementById('help-dots');
  const helpPrev = document.getElementById('help-prev');
  const helpNext = document.getElementById('help-next');

  const ICON_MOVE = '<div class="key-row"><span class="keycap">A</span><span class="keycap">S</span><span class="keycap">D</span><span class="keycap" style="min-width:64px;">空格</span></div>';
  const ICON_RUNE = '<svg viewBox="0 0 100 100" fill="none" stroke="#d8ccff" stroke-width="3"><circle cx="50" cy="50" r="30" opacity="0.5"/><circle cx="50" cy="50" r="20" opacity="0.8"/><path d="M50 14 L50 30 M50 70 L50 86 M14 50 L30 50 M70 50 L86 50 M25 25 L36 36 M64 64 L75 75 M75 25 L64 36 M36 64 L25 75" stroke-linecap="round"/><circle cx="50" cy="50" r="6" fill="#efe6ff" stroke="none"/></svg>';
  const ICON_STAR = '<svg viewBox="0 0 100 100" fill="none"><path d="M50 12 L59 38 L87 40 L65 58 L73 86 L50 70 L27 86 L35 58 L13 40 L41 38 Z" fill="#ffe9a8" stroke="#fff3d0" stroke-width="2" stroke-linejoin="round"/></svg>';

  const helpPages = [
    { visual: ICON_MOVE, text: 'A / D 或 ← / → 左右移动<br>W 或 空格 跳跃' },
    { visual: ICON_RUNE, text: '踩下悬空法阵可触发机关<br>浮块移动，开辟新的道路<br>再踩一次即可复位' },
    { visual: ICON_STAR, text: '穿过空间裂缝在地图间穿梭<br>触碰星辰即可过关<br>小心，不要坠入虚空' }
  ];
  let helpIdx = 0;
  function renderHelp() {
    const p = helpPages[helpIdx];
    helpPage.innerHTML = '<div class="help-visual">' + p.visual + '</div><div class="help-text">' + p.text + '</div>';
    helpDots.innerHTML = helpPages.map((_, i) => '<span class="d' + (i === helpIdx ? ' active' : '') + '"></span>').join('');
    helpPrev.disabled = helpIdx === 0;
    helpNext.innerHTML = helpIdx === helpPages.length - 1 ? '✓' : '›';
  }
  function openHelp() { helpIdx = 0; renderHelp(); helpOverlay.classList.add('open'); playChime(); }
  function closeHelp() { helpOverlay.classList.remove('open'); playChime(); }
  helpBtn.addEventListener('click', (e) => { e.stopPropagation(); openHelp(); });
  helpClose.addEventListener('click', (e) => { e.stopPropagation(); closeHelp(); });
  helpPrev.addEventListener('click', (e) => { e.stopPropagation(); if (helpIdx > 0) { helpIdx--; renderHelp(); playChime(); } });
  helpNext.addEventListener('click', (e) => {
    e.stopPropagation(); playChime();
    if (helpIdx < helpPages.length - 1) { helpIdx++; renderHelp(); }
    else closeHelp();
  });
  helpOverlay.addEventListener('click', (e) => { if (e.target === helpOverlay) closeHelp(); });

  // ---------- 选关界面 ----------
  const levelOverlay = document.getElementById('level-overlay');
  const levelCards = document.getElementById('level-cards');
  const levelBack = document.getElementById('level-back');

  const LEVELS = [
    { n: 1, name: '第一关', file: '../prototype-ch1.html' },
    { n: 2, name: '第二关', file: '../prototype-ch2.html' },
    { n: 3, name: '第三关', file: '../prototype-ch3.html' }
  ];
  const LOCK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';

  function isCleared(n) { return localStorage.getItem('zxz_clear_' + n) === '1'; }
  function isUnlocked(level, i) { return i === 0 || isCleared(level.n - 1); }

  function renderLevels() {
    levelCards.innerHTML = '';
    LEVELS.forEach((lv, i) => {
      const unlocked = isUnlocked(lv, i);
      const item = document.createElement('div');
      item.className = 'level-item ' + (unlocked ? 'open' : 'locked');
      const card = document.createElement('div');
      card.className = 'level-card';
      card.setAttribute('role', 'button');
      card.setAttribute('aria-label', unlocked ? (lv.name + '，可进入') : (lv.name + '，未解锁'));
      card.innerHTML = unlocked ? lv.n : LOCK_SVG;
      const name = document.createElement('div');
      name.className = 'level-name';
      name.textContent = lv.name;
      item.appendChild(card);
      item.appendChild(name);
      if (unlocked) {
        card.addEventListener('click', (e) => { e.stopPropagation(); playChime(); fadeGo(lv.file); });
      }
      levelCards.appendChild(item);
    });
  }
  function openLevelSelect() { renderLevels(); levelOverlay.classList.add('open'); playChime(); }
  function closeLevelSelect() { levelOverlay.classList.remove('open'); playChime(); }
  levelBack.addEventListener('click', (e) => { e.stopPropagation(); closeLevelSelect(); });

  // ---------- 导航 ----------
  let navigated = false;
  function anyOverlayOpen() {
    return overlay.classList.contains('open') || helpOverlay.classList.contains('open') || levelOverlay.classList.contains('open');
  }
  function fadeGo(url) {
    if (navigated) return;
    navigated = true;
    document.body.style.transition = 'opacity 1s ease';
    document.body.style.opacity = '0';
    setTimeout(() => { window.location.href = url; }, 900);
  }
  function startGame() {
    if (anyOverlayOpen() || navigated) return;
    openLevelSelect(); // 开始游戏 → 进入选关
  }
  function watchPrologue() {
    playChime();
    fadeGo('../cg-opening/opening-cg-player.html');
  }
  startBtn.addEventListener('click', (e) => { e.stopPropagation(); tryStartBgm(); startGame(); });
  prologueLink.addEventListener('click', (e) => { e.stopPropagation(); tryStartBgm(); watchPrologue(); });
  replayBtn.addEventListener('click', (e) => { e.stopPropagation(); watchPrologue(); });

  // 键盘：Enter / 空格 开始（设置面板打开时不响应）
  window.addEventListener('keydown', (e) => {
    if (navigated) return;
    tryStartBgm();
    if ((e.key === 'Enter' || e.key === ' ') && !overlay.classList.contains('open')) {
      // 避免焦点在按钮上时重复触发
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      e.preventDefault();
      startGame();
    }
  });
})();
</script>
</body>
</html>
